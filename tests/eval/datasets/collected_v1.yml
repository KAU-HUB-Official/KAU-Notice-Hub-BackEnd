# =============================================================================
# S2. robustness — 오타/자판오류/축약/구어체 변형. RAGAS 채점 대상.
#     정상 표현(rag_quality) 대비 답변 품질이 유지되는지 본다. 검색에 도달하지 못해
#     스킵되면 입력 정규화 실패로 해석한다.
# =============================================================================
robustness:
  - id: rb-kbd-workstudy
