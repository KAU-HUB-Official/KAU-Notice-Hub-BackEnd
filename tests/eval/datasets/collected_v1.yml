# 팀 수집 자연어 질문셋 (미정제 draft) — RAGAS 평가용. 팀원 수집분 원본을 분류만 한 상태.
# 1차 수집분에 2차 수집분(2026-09-14)을 더했다. 2차 항목은 각 그룹의 '2차 수집' 구역에 있다.
#
# RAGAS 러너는 이 파일을 직접 읽지 않는다. 정제를 마친 뒤 tests/eval/ragas_cases.yml 형식으로
# 옮겨 RAGAS(LLM-as-judge)로 채점한다. 분기 검증기(branch_runner)는 기본 입력으로 바로 읽는다.
# 두 그룹 모두 RAGAS 채점 대상이다.
#   rag_quality  -> 정상 표현 질문
#   robustness   -> 같은 의도의 오타·자판오류·축약·구어체 변형
#
# 러너는 triage 가 search 로 안 보내거나 검색 0건이면 샘플을 버린다(스킵). 따라서 모든
# 항목은 검색에 도달해야 점수가 나온다. robustness 항목이 스킵되면 그 자체가 "입력 정규화
# 실패" 신호다. 스킵 목록은 러너 리포트와 dump 아티팩트에, 건수는 eval_history.csv 에 남는다.
#
# 필드
# - id: 고유 식별자
# - question: 사용자 발화
# - tags: [intent, style]
# - decoded: 오타·자판오류 원문의 해독 결과(정제 시 question 을 이걸로 바꿀지 결정)
# - filters: 백엔드 NoticeQuery 필터 (선택)
# - notes: 케이스 의도·주의점
# - todo: 정제 단계에서 사람이 판단해야 하는 항목(모호·미확인)
#
# 정제 전 필수 작업은 파일 하단 REFINEMENT NOTES 참고.

# =============================================================================
# S1. rag_quality — 검색 성공이 기대되는 정상 질문. RAGAS 채점 대상 후보.
# =============================================================================
