# =============================================================================
# REFINEMENT NOTES — 정제 단계에서 처리할 것
# =============================================================================
# 1) grounding 검증 (필수)
#    ragas_cases.yml 헤더 기준: 각 질문이 (a) triage 에서 search 로 가고 (b) 실 DB 검색 시
#    결과가 충분히 나와야 채점된다. OpenAI 없이 find_relevant_notices 로 돌려 확인한다.
#    - rag_quality: question 자체로 검색 0건이면 제외(안 그러면 매번 스킵되어 점수에 안 잡힘).
#    - robustness: decoded 로 검색해 본다. decoded 가 결과를 내면 원문이 스킵돼도 유효한
#      케이스다(그게 측정하려는 정규화 격차). decoded 로도 0건이면 제외.
#
# 2) 근사 중복 / 주제 쏠림
#    - rq-graduation-req ("졸업 요건 관련 공지 찾아줘") vs 원본 B-30 ("졸업요건 알려줘")
#    - 수강신청 클러스터: rq-enrollment-change / rb-kbd-enrollment / rb-romanized-mixed /
#      rb-codeswitch-glued / rb-consonant-abbrev / rb-heavy-typo-urgent / rb-repeat-keyword
#      — 같은 의도의 표현 변형이 7개(전체 89개 중 약 8%). RAGAS 평균이 수강신청 한 주제의 성능에
#      쏠리므로, 변형 개수를 줄이거나 리포트에서 태그별로 따로 볼 것.
#    - 2차 추가분 rq-credit-limit(최대학점) / rq-enrollment-quota-increase(증원)도 수강신청 주제라,
#      의도는 달라도 주제 기준으로는 수강신청 쏠림이 9개(약 10%)다.
#    - 공모전: rq-contest-week / rq-contest-month 는 시간창만 다름. 둘 다 유지 가능.
#
# 3) 날짜 의존 케이스
#    "오늘/이번주/이번 달/이번 학기/최근/지금" 기준 질문은 스냅샷 DB(약 2026-05 기준)에서 결과가 비거나
#    시간이 지나면 답이 바뀐다. 고정 회귀셋에 넣으려면 (a) 기준일을 고정하거나
#    (b) 상대 시간 표현을 절대 날짜로 바꾸거나 (c) 고정셋에서 제외할지 정해야 한다.
#
# 4) filters 문자열 검증
#    rq-grad-scholarship-filtered 등 filters 를 쓰는 케이스는 docs/CLASSIFICATION.md 의
#    정확한 문자열이어야 한다. 틀리면 검색 0건 → 스킵.
#
# 5) todo 항목 해소
#    소학 / 항우기 / 학연생 / 기수교ㅏ / 국문과 — 의미·존재 확인 후 교정 또는 삭제.
#    2차: 학칙·교육과정 영역(재수강·학점포기·조기졸업·교양필수), 시설·IT 안내(프린트·와이파이)
#    — 공지 근거가 있는지 grounding 확인 후 유지 여부 결정.
